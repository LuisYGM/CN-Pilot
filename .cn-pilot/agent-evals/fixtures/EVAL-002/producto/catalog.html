<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Catalog fixture</title></head>
  <body>
    <main>
      <h1>Catalog</h1>
      <label for="catalog-query">Search products</label>
      <input id="catalog-query" type="search">
      <p id="result-count" aria-live="polite">3 products</p>
      <p id="empty-message" hidden>No products match your search.</p>
      <ul id="catalog">
        <li data-category="books">Notebook</li>
        <li data-category="tools">Desk lamp</li>
        <li data-category="books">Sketchbook</li>
      </ul>
    </main>
  </body>
</html>
