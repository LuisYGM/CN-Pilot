<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CN Pilot — coordinación web con control humano</title>
  <desc id="description">Identidad CN Pilot junto al mensaje “Explica lo que quieres. Coordina el trabajo.” y una ruta adaptable con decisión humana.</desc>
  <rect width="1200" height="630" fill="#172022"/>
  <image x="72" y="56" width="70" height="70" href="cn-pilot-mark-light.svg" xlink:href="cn-pilot-mark-light.svg"/>
  <text x="162" y="101" fill="#f4f5f2" font-family="Space Grotesk, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-1">CN Pilot</text>
  <text x="74" y="198" fill="#b5c1c1" font-family="Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">COORDINACIÓN WEB · KILO CODE</text>
  <text x="72" y="292" fill="#f4f5f2" font-family="Space Grotesk, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-3">Explica lo que</text>
