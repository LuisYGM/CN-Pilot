  <circle cx="1067" cy="222" r="9" fill="#1e292b" stroke="#00b8e6" stroke-width="3"/><text x="1004" y="263" fill="#f4f5f2" stroke="#1e292b" stroke-width="8" paint-order="stroke fill" stroke-linejoin="round" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Coordinación</text>
  <circle cx="1067" cy="400" r="10" fill="#f04e24" stroke="#f04e24" stroke-width="2"/><text x="1035" y="366" fill="#f4f5f2" stroke="#1e292b" stroke-width="8" paint-order="stroke fill" stroke-linejoin="round" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">Revisión humana</text>
