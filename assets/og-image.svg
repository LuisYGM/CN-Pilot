  <text x="72" y="438" fill="#00b8e6" font-family="Space Grotesk, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-3">Coordina el trabajo.</text>
  <text x="76" y="500" fill="#c5cece" font-family="Space Grotesk, Arial, sans-serif" font-size="23">Trabajo web coordinado.</text>
  <text x="76" y="535" fill="#c5cece" font-family="Space Grotesk, Arial, sans-serif" font-size="23">Control humano en cada decisión.</text>
  <rect x="700" y="116" width="432" height="394" rx="2" fill="#1e292b" stroke="#536467" stroke-width="1.5"/>
  <text x="730" y="154" fill="#b5c1c1" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">EL OBJETIVO ORIENTA LA RUTA</text>
