name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno aprobado para el despliegue
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Añade aquí el build, artifact y método de transporte confirmado para
      # el proyecto: SSH, SFTP, rsync, hosting específico, WordPress u otro.
      # Referencia credenciales mediante GitHub Actions Secrets o secretos del
      # environment; nunca escribas sus valores en este archivo.
      #
      # env:
      #   DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      #   DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      #   DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Bloquear template sin configurar
        shell: bash
        run: |
          echo "::error::Configura y verifica el método de deployment antes de activar este workflow."
          exit 1
